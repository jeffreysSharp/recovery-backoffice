trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: windows-latest

variables:
  evaluationRoot: '$(Build.SourcesDirectory)/evaluation/Recovery.TemplateEvaluation'

steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: '10.x'

  - task: NodeTool@0
    displayName: Install Node.js
    inputs:
      versionSpec: '24.x'

  - task: SonarCloudPrepare@4
    displayName: Prepare existing Sonar project
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      SonarCloud: sc-recovery-backoffice-sonar
      organization: gauss-platform
      scannerMode: dotnet
      projectKey: gauss-platform_recovery-backoffice
      projectName: Recovery BackOffice
      projectVersion: '$(Build.BuildNumber)'
      extraProperties: |
        sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/artifacts/test-results/**/coverage.opencover.xml
        sonar.cs.vstest.reportsPaths=$(Build.SourcesDirectory)/artifacts/test-results/**/*.trx
        sonar.exclusions=**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,.evaluation/**
        sonar.qualitygate.wait=true
        sonar.qualitygate.timeout=300

  - task: PowerShell@2
    displayName: Build and test template evaluation
    inputs:
      targetType: filePath
      filePath: scripts/verify-template.ps1
      workingDirectory: $(Build.SourcesDirectory)
      pwsh: true

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: 'artifacts/test-results/**/*.trx'
      searchFolder: $(Build.SourcesDirectory)
      mergeTestResults: true
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

  - task: PublishCodeCoverageResults@2
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(Build.SourcesDirectory)/artifacts/test-results/**/coverage.cobertura.xml'
      failIfCoverageEmpty: true

  - task: SonarCloudAnalyze@4
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))

  - task: SonarCloudPublish@4
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    inputs:
      pollingTimeoutSec: '300'

  - task: PublishPipelineArtifact@1
    displayName: Publish evaluation artifacts
    inputs:
      targetPath: '$(Build.SourcesDirectory)/artifacts/publish'
      artifact: recovery-template-evaluation
      publishLocation: pipeline

# Deployment is specified separately after validating target services and settings.
# Do not reuse the old Hello World deployment/smoke check for this application.
