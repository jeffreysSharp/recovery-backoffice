trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: windows-latest

# Exact versions verified against published SonarSource sc-4.2.6.2781 and
# Microsoft azure-pipelines-tasks v281 manifests. Review pins when updating.
stages:
  - stage: BackendQuality
    displayName: '1. Backend e testes'
    jobs:
      - job: ValidateBackend
        displayName: Build, testes, cobertura e Sonar
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - task: UseDotNet@2.281.2
            displayName: Instalar .NET 10 SDK
            inputs:
              packageType: sdk
              version: '10.x'

          # Prepare, build and Analyze must share the same job/workspace.
          - task: SonarCloudPrepare@4.2.6
            displayName: Preparar análise Sonar
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              SonarCloud: sc-recovery-backoffice-sonar
              organization: gauss-platform
              scannerMode: dotnet
              projectKey: gauss-platform_recovery-backoffice
              projectName: Recovery BackOffice
              projectVersion: '$(Build.BuildNumber)'
              extraProperties: |
                sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/artifacts/test-results/**/coverage.opencover.xml
                sonar.cs.vstest.reportsPaths=$(Build.SourcesDirectory)/artifacts/test-results/**/*.trx
                sonar.exclusions=**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,.evaluation/**
                sonar.qualitygate.wait=true
                sonar.qualitygate.timeout=300

          - task: PowerShell@2.281.0
            displayName: Compilar e testar backend
            inputs:
              targetType: filePath
              filePath: scripts/verify-template.ps1
              arguments: '-Phase Backend -Configuration Release'
              workingDirectory: $(Build.SourcesDirectory)
              pwsh: true

          - task: PublishTestResults@2.279.0
            displayName: Publicar resultados dos testes
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: 'artifacts/test-results/**/*.trx'
              searchFolder: $(Build.SourcesDirectory)
              mergeTestResults: true
              failTaskOnFailedTests: true
              failTaskOnMissingResultsFile: true

          - task: PublishCodeCoverageResults@2.281.1
            displayName: Publicar cobertura
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(Build.SourcesDirectory)/artifacts/test-results/**/coverage.cobertura.xml'
              failIfCoverageEmpty: true

          - task: SonarCloudAnalyze@4.2.6
            displayName: Executar análise e validar Quality Gate
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))

          - task: SonarCloudPublish@4.2.6
            displayName: Publicar resultado do Quality Gate
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              pollingTimeoutSec: '300'

          - task: PublishPipelineArtifact@1.279.0
            displayName: Disponibilizar pacote da API para próxima etapa
            inputs:
              targetPath: '$(Build.SourcesDirectory)/artifacts/publish/api'
              artifact: backend-package
              publishLocation: pipeline

  - stage: FrontendBuild
    displayName: '2. Frontends'
    dependsOn: BackendQuality
    jobs:
      - job: BuildClients
        displayName: Verificar TypeScript e compilar Admin e Dashboard
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0.281.0
            displayName: Instalar Node.js 24
            inputs:
              versionSpec: '24.x'

          - task: PowerShell@2.281.0
            displayName: Instalar dependências e compilar frontends
            inputs:
              targetType: filePath
              filePath: scripts/verify-template.ps1
              arguments: '-Phase Frontend'
              workingDirectory: $(Build.SourcesDirectory)
              pwsh: true

          - task: PublishPipelineArtifact@1.279.0
            displayName: Disponibilizar pacotes dos frontends
            inputs:
              targetPath: '$(Build.SourcesDirectory)/artifacts/publish'
              artifact: frontend-package
              publishLocation: pipeline

  - stage: Package
    displayName: '3. Artefatos'
    dependsOn: FrontendBuild
    jobs:
      - job: PublishRelease
        displayName: Consolidar API, Admin e Dashboard aprovados
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2.279.0
            displayName: Obter API desta execução
            inputs:
              buildType: current
              artifactName: backend-package
              targetPath: '$(Pipeline.Workspace)/release/api'

          - task: DownloadPipelineArtifact@2.279.0
            displayName: Obter frontends desta execução
            inputs:
              buildType: current
              artifactName: frontend-package
              targetPath: '$(Pipeline.Workspace)/release'

          - task: PublishPipelineArtifact@1.279.0
            displayName: Publicar pacote final Recovery BackOffice
            inputs:
              targetPath: '$(Pipeline.Workspace)/release'
              artifact: recovery-backoffice
              publishLocation: pipeline

# Deployment remains separate until target services/settings are validated.
