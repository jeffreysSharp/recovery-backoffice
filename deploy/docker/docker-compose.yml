# Local evaluation stack. SQL Server Developer is for development/test only.
name: recovery
services:
  redis:
    image: valkey/valkey:9.1.0-alpine
    container_name: recovery-redis
    restart: unless-stopped
    command:
      - valkey-server
      - '--requirepass'
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - '--appendonly'
      - 'yes'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - valkey-cli -a $$REDIS_PASSWORD PING | grep PONG
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: recovery-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CORS_ALLOWED_ORIGINS: ${Recovery_ADMIN_URL},${Recovery_DASHBOARD_URL}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - '-fsS'
        - http://localhost:9000/health
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - ${Recovery_S3_PORT:-9000}:9000
  rustfs-init:
    image: amazon/aws-cli:2.37.3
    container_name: recovery-rustfs-init
    restart: 'no'
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - '-c'
      - >
        set -e

        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket recovery 2>/dev/null ||
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket recovery
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket recovery --policy
        '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::recovery/public/*"]}]}'
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: recovery-mailpit
    restart: unless-stopped
    profiles:
      - mail-catcher
    ports:
      - 127.0.0.1:${Recovery_MAILPIT_PORT:-8025}:8025
  migrator:
    build:
      context: ../..
      dockerfile: src/Host/Recovery.BackOffice.DbMigrator/Dockerfile
    image: recovery/dbmigrator:local
    container_name: recovery-migrator
    restart: 'no'
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      DatabaseOptions__ConnectionString: Server=sqlserver;Database=RecoveryBackOffice;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=true;TrustServerCertificate=true
      CachingOptions__Redis: redis,password=${REDIS_PASSWORD}
      JwtOptions__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Seed__DefaultAdminPassword: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
      DatabaseOptions__Provider: MSSQL
      DatabaseOptions__MigrationsAssembly: Recovery.BackOffice.Migrations.SqlServer
    command:
      - apply
      - '--seed'
  api:
    build:
      context: ../..
      dockerfile: src/Host/Recovery.BackOffice.Api/Dockerfile
    image: recovery/api:local
    container_name: recovery-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
      sqlserver:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DatabaseOptions__ConnectionString: Server=sqlserver;Database=RecoveryBackOffice;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=true;TrustServerCertificate=true
      CachingOptions__Redis: redis,password=${REDIS_PASSWORD}
      JwtOptions__SigningKey: ${JWT_SIGNING_KEY}
      Seed__DefaultAdminPassword: ${SEED_ADMIN_PASSWORD}
      Storage__Provider: s3
      Storage__S3__ServiceUrl: http://rustfs:9000
      Storage__S3__PresignServiceUrl: ${Recovery_S3_PUBLIC_URL:?Recovery_S3_PUBLIC_URL is required}
      Storage__S3__PublicBaseUrl: ${Recovery_S3_PUBLIC_URL}/recovery
      Storage__S3__AccessKey: ${RUSTFS_ACCESS_KEY}
      Storage__S3__SecretKey: ${RUSTFS_SECRET_KEY}
      Storage__S3__Bucket: recovery
      Storage__S3__ForcePathStyle: 'true'
      MailOptions__Smtp__Host: ${Recovery_SMTP_HOST:-mailpit}
      MailOptions__Smtp__Port: ${Recovery_SMTP_PORT:-1025}
      MailOptions__Smtp__Security: ${Recovery_SMTP_SECURITY:-None}
      MailOptions__Smtp__UserName: ${Recovery_SMTP_USERNAME:-}
      MailOptions__Smtp__Password: ${Recovery_SMTP_PASSWORD:-}
      MailOptions__From: ${Recovery_MAIL_FROM:-no-reply@recovery.local}
      AllowedHosts: '*'
      HangfireOptions__UserName: ${HANGFIRE_USERNAME:?HANGFIRE_USERNAME is required}
      HangfireOptions__Password: ${HANGFIRE_PASSWORD:?HANGFIRE_PASSWORD is required}
      CorsOptions__AllowedOrigins__0: ${Recovery_ADMIN_URL:?Recovery_ADMIN_URL is required}
      CorsOptions__AllowedOrigins__1: ${Recovery_DASHBOARD_URL:?Recovery_DASHBOARD_URL is required}
      FrontendOptions__AllowedOrigins__0: ${Recovery_ADMIN_URL}
      FrontendOptions__AllowedOrigins__1: ${Recovery_DASHBOARD_URL}
      FrontendOptions__DefaultOrigin: ${Recovery_DASHBOARD_URL}
      OpenTelemetryOptions__Exporter__Otlp__Endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DatabaseOptions__Provider: MSSQL
      DatabaseOptions__MigrationsAssembly: Recovery.BackOffice.Migrations.SqlServer
    ports:
      - ${Recovery_API_PORT:-8080}:8080
  admin:
    build:
      context: ../../clients/admin
    image: recovery/admin:local
    container_name: recovery-admin
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      Recovery_API_URL: ${Recovery_API_URL:?Recovery_API_URL is required}
      Recovery_DASHBOARD_URL: ${Recovery_DASHBOARD_URL}
      Recovery_DEFAULT_TENANT: ${Recovery_DEFAULT_TENANT:-root}
    ports:
      - ${Recovery_ADMIN_PORT:-8081}:80
  dashboard:
    build:
      context: ../../clients/dashboard
    image: recovery/dashboard:local
    container_name: recovery-dashboard
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      Recovery_API_URL: ${Recovery_API_URL}
      Recovery_DEFAULT_TENANT: ${Recovery_DEFAULT_TENANT:-root}
    ports:
      - ${Recovery_DASHBOARD_PORT:-8082}:80
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  redis_data: null
  rustfs_data: null
  sqlserver_data: {}
